modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# One mixin, into Create's RotationPropagator, so a large cogwheel can drive the
# controller under it. Create hardcodes that case to its own speed controller and exposes
# no hook on the receiving side. Listed in the common "mixins" array of the json, never a
# client/server sub-array - those silently never apply on NeoForge.
[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Hard dependency, two ways over. Every block here extends a Create kinetic block, so
# the mod cannot even classload without it; and the models reference create: texture
# paths directly rather than shipping copies of Create's art, which is All Rights
# Reserved. See NOTICE.
[[dependencies.${mod_id}]]
modId="create"
type="required"
versionRange="[6.0,)"
ordering="AFTER"
side="BOTH"
