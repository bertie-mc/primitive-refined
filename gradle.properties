mod_description=An early-game, Create-powered precursor to Refined Storage. Its machines run on rotational force and consume stress units instead of energy. This build is a demo containing the Primitive Controller and the Soulstained Shaft.

# --- Create and its API surface -------------------------------------------------
# create_version is the maven.createmod.net build that corresponds to the Modrinth
# release create-1.21.1-6.0.10.jar pinned in packs/*/mods/create.pw.toml. The maven
# publishes per-CI-build versions, so 6.0.10 there is 6.0.10-281.
#
# ponder carries Catnip inside it (net.createmod.catnip lives in the ponder jar, not
# in Create's own jar or a standalone artifact) - do not go looking for a catnip
# coordinate, there isn't one for 1.21.1.
#
# These versions are the exact ones Create 6.0.10 jar-in-jars; see its
# META-INF/jarjar/metadata.json. Bump them together with create_version.
create_version=6.0.10-281
ponder_version=1.0.82+mc1.21.1
flywheel_version=1.0.6
